name: Xây dựng file APK Android cho Pydroid 3 Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kiểm tra kho lưu trữ (Checkout)
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Chấp nhận giấy phép Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. Cài đặt các gói phụ thuộc
        run: |
          npm install --legacy-peer-deps

      - name: 6. Xây dựng các tài nguyên ứng dụng web
        run: |
          npm run build

      - name: 7. Cài đặt và tích hợp Capacitor Android
        run: |
          npm install --save-dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Pydroid 3 Web" "org.pydroid3.web" --web-dir dist
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Cấp quyền thực thi cho Gradle
        run: |
          chmod +x android/gradlew || true

      - name: 9. Xây dựng tệp APK Android
        run: |
          cd android && ./gradlew assembleDebug

      - name: 10. Tìm và xác minh tệp APK đã tạo
        run: |
          ls -la android/app/build/outputs/apk/debug/

      - name: 11. Tải lên file APK (Tải xuống trên điện thoại)
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Web-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
