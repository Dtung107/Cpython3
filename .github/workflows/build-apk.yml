name: Build Android APK (Pydroid 3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Biên Dịch APK Android với Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: 2. Biên dịch APK Android với Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: master

      - name: 3. Tải tập tin APK thành phẩm lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PydroidApp-debug-apk
          path: bin/*.apk
          retention-days: 14
